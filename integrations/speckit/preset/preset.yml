schema_version: "1.0"

preset:
  id: "oneco-lean"
  name: "OneCo Lean Workflow"
  version: "0.1.0"
  description: "Minimal Spec Kit workflow with OneCo brief, governance, and checkpoint traceability"
  author: "OneCo"
  license: "MIT"

requires:
  speckit_version: ">=1.0.3,<2.0.0"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      strategy: "replace"
      description: "Create the active OneCo specification from its brief and seed"
      replaces: "speckit.specify"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      strategy: "replace"
      description: "Create the minimum sound implementation plan"
      replaces: "speckit.plan"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      strategy: "replace"
      description: "Create a dependency-ordered queue with checkpoint-stable task IDs"
      replaces: "speckit.tasks"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      strategy: "replace"
      description: "Execute and verify one checkpoint-addressable task at a time"
      replaces: "speckit.implement"
    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      strategy: "replace"
      description: "Maintain concrete OneCo engineering governance"
      replaces: "speckit.constitution"
    - type: "template"
      name: "brief-template"
      file: "templates/brief-template.md"
      strategy: "replace"
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      strategy: "replace"
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      strategy: "replace"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      strategy: "replace"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      strategy: "replace"

tags:
  - "oneco"
  - "lean"
  - "checkpoint"
  - "local-first"
